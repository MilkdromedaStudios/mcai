<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c2140"/>
      <stop offset="1" stop-color="#0b0d18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9db8ff"/>
      <stop offset="1" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a6cf0"/>
      <stop offset="1" stop-color="#2c3fb0"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3a9e"/>
      <stop offset="1" stop-color="#161f63"/>
    </linearGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- squircle tile -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- isometric block -->
  <g transform="translate(256 268)">
    <polygon points="0,-150 130,-75 0,0 -130,-75" fill="url(#top)"/>
    <polygon points="-130,-75 0,0 0,150 -130,75" fill="url(#left)"/>
    <polygon points="130,-75 0,0 0,150 130,75" fill="url(#right)"/>
    <!-- crisp edges -->
    <polyline points="-130,-75 0,0 130,-75" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="150" stroke="#ffffff" stroke-opacity="0.18" stroke-width="3"/>

    <!-- glowing visor eyes on the front faces -->
    <g filter="url(#neon)" fill="#5ff2ff">
      <polygon points="-98,-14 -58,9 -58,35 -98,12"/>
      <polygon points="98,-14 58,9 58,35 98,12"/>
    </g>
    <!-- circuit traces on the top face -->
    <g stroke="#ffffff" stroke-opacity="0.85" stroke-width="7" stroke-linecap="round" fill="none">
      <polyline points="-52,-75 0,-45 52,-75"/>
      <line x1="0" y1="-45" x2="0" y2="-105"/>
    </g>
    <g fill="#ffffff">
      <circle cx="-52" cy="-75" r="11"/>
      <circle cx="52" cy="-75" r="11"/>
      <circle cx="0" cy="-105" r="11"/>
    </g>
  </g>

  <!-- AI spark -->
  <g transform="translate(392 118)" filter="url(#neon)">
    <path d="M0,-38 C6,-8 8,-6 38,0 C8,6 6,8 0,38 C-6,8 -8,6 -38,0 C-8,-6 -6,-8 0,-38 Z" fill="#5ff2ff"/>
  </g>
</svg>
